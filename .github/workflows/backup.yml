# Daily backup of the live system: runs `python manage.py backup_system` (database + uploaded files -> one zip in the Supabase bucket,
# listed in Admin > Backup as "Scheduled"). Free alternative to a paid Render cron job. Setup and secrets: docs/BACKUP_AND_RESTORE.md.
name: Daily backup

on:
  schedule:
    - cron: '0 18 * * *'   # 18:00 UTC = 02:00 the next morning in the Philippines (GitHub evaluates schedules in UTC)
  workflow_dispatch:       # the "Run workflow" button, to test it without waiting for the night

permissions:
  contents: read

concurrency:
  group: system-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: oma_aringay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: oma_aringay/requirements.txt

      - name: Install requirements
        # mysqlclient is only for the local MySQL fallback and needs system libraries to build; the live system uses PostgreSQL.
        run: |
          grep -v -i '^mysqlclient' requirements.txt > requirements-backup.txt
          pip install -r requirements-backup.txt

      - name: Back up the system
        env:
          # The backup never signs anything, so this key is a placeholder, not the live SECRET_KEY.
          SECRET_KEY: backup-job-placeholder-not-the-live-key
          PYTHONUNBUFFERED: '1'
          PYTHONFAULTHANDLER: '1'
          DJANGO_DEBUG: 'false'
          DB_BACKEND: postgres
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_STORAGE_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_ACCESS_KEY }}
          SUPABASE_STORAGE_SECRET_KEY: ${{ secrets.SUPABASE_STORAGE_SECRET_KEY }}
          SUPABASE_STORAGE_ENDPOINT: ${{ secrets.SUPABASE_STORAGE_ENDPOINT }}
          SUPABASE_STORAGE_REGION: ${{ secrets.SUPABASE_STORAGE_REGION }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
        # A backup of this system takes about a minute. If it ever gets stuck, `timeout` aborts it after 20 minutes and
        # the fault handler prints where it was stuck, so the log says what to fix.
        run: timeout -s ABRT 20m python manage.py backup_system
